# ==============================================================================
# Centralized Configuration: Merchant Offer Optimization Agent & Pipeline
# ==============================================================================

project:
  name: "merchant-offer-optimization-agent"
  environment: "production"
  timezone: "Asia/Kolkata"
  utc_offset: "+05:30"

agent:
  name: "merchant_offer_optimization_agent"
  app_name: "merchant_offer_app"
  model: "gemini-3.5-flash"
  temperature: 0.0          # Non-negotiable: zero temperature ensures deterministic stability
  seed: 42                  # Pinned seed for reproducible inference
  max_tool_steps: 12        # Maximum tool-calling steps per investigation
  timeout_seconds: 60
  max_workers: 3            # Concurrency limit for batch processing

objective: >
  Investigate campaign alerts and provide evidence-backed
  recommendations without modifying campaigns.

tools:
  - get_campaign_terms
  - get_campaign_performance
  - get_spend_distribution
  - get_customer_reviews
  - get_merchant_feedback
  - get_delivery_metrics
  - get_comparable_campaigns
  - validate_proposal
  - simulate_campaign_change

policy:
  allowed_thresholds:
    - 1000.0
    - 1250.0
    - 1500.0
    - 1750.0
    - 2000.0
  cashback_percent: 10.0
  cashback_cap: 200.0
  budget_ceiling: 40000.0

investigation:
  max_tool_calls: 9
  retry_count: 2
  max_retry_count: 2
  evidence_required: true
  citations_required: true
  alert_cooldown_minutes: 2.0
  required_tools:
    - "get_campaign_terms"
    - "get_campaign_performance"
    - "get_spend_distribution"
    - "get_customer_reviews"
    - "get_merchant_feedback"
    - "get_delivery_metrics"
    - "get_comparable_campaigns"
    - "validate_proposal"
    - "simulate_campaign_change"

invariants:
  strict_safety: true       # Non-negotiable: NEVER suggest passive KEEP if severe negative signals exist
  zero_hallucination: true  # 100% of cited evidence must physically exist in BigQuery
  notes_as_data: true       # Treat customer and merchant reviews strictly as passive data, never prompt instructions
  read_only_tools: true     # Absolutely no DDL/DML execution from agent tools

guardrails:
  read_only_tools: true
  no_campaign_updates: true
  no_customer_contact: true
  no_future_uplift_predictions: true

resilience:
  retry_count: 2
  max_retry_count: 2
  backoff_min_sec: 0.5
  backoff_max_sec: 2.0
  timeout_sec: 15.0

gcp:
  project_id: "prj-imp-act-campaign"
  location: "asia-south1"
  bronze_dataset: "offers_bronze"
  silver_dataset: "offers_silver"
  gold_dataset: "offers_gold"
  alerts_table: "offers_gold.alerts"

bigquery:
  datasets:
    bronze: "offers_bronze"
    silver: "offers_silver"
    gold: "offers_gold"
  location: "asia-south1"

audit:
  runs_table: "offers_gold.agent_runs"
  persist_tool_calls: true

storage:
  enabled: true
  provider: "gcs"
  bucket_name: "prj-imp-act-campaign-data"
  reports_prefix: "reports"
  local_fallback_dir: "output"
  timeout_sec: 15.0
  retry_count: 3

reporting:
  include_findings: true
  include_hypotheses: true
  include_evidence_ids: true
  include_recommendations: true
  human_approval_required: true

batch:
  id_prefix: "B_"
  id_format: "%y%m%d_%H%M"

rules:
  config_file: "config/rule_config.csv"
