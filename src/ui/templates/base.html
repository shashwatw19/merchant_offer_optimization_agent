<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Merchant Offer Optimization Agent — Evidence-led campaign investigations">
  <title>{% block title %}Merchant Offer Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand-group">
      <a class="brand" href="/">
        <span class="brand-icon" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="3" width="20" height="14" rx="2" stroke="currentColor" stroke-width="1.75" fill="none"/>
            <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
            <path d="M7 10l3 3 3-3 4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        Merchant Offer Agent
      </a>
      <span class="header-caption">Evidence-led campaign investigations</span>
    </div>
    <nav class="navigation" aria-label="Main navigation">
      <a id="nav-alerts" class="nav-button {% if active_page == 'alerts' %}active{% endif %}" href="/">
        <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Alerts
      </a>
      <a id="nav-admin" class="nav-button {% if active_page == 'admin' %}active{% endif %}" href="/admin">
        <svg class="nav-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
          <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
        </svg>
        Admin Panel
      </a>
    </nav>
  </header>
  <main class="page-container {% if active_page == 'admin' %}admin-container{% endif %}">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>Merchant Offer Optimization Agent</span>
    <span class="footer-sep" aria-hidden="true">·</span>
    <span>All recommendations require human approval before deployment</span>
  </footer>
</body>
</html>
