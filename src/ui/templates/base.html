<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Merchant Offer Agent{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="header-brand-group">
      <a class="brand" href="/">Merchant Offer Optimization Agent</a>
      <span class="header-caption">Evidence-Led Campaign Investigations</span>
    </div>
    <div class="header-badges">
      <span class="engine-badge">Google ADK</span>
      <span class="engine-badge bq-badge">BigQuery Connected</span>
    </div>
  </header>
  <main class="page-container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
