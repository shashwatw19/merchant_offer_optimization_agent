<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Merchant Offer Agent{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="brand-group">
      <a class="brand" href="/">Merchant Offer Agent</a>
      <span class="header-caption">Evidence-led campaign investigations</span>
    </div>
    <nav class="navigation" aria-label="Main navigation">
      <a id="nav-alerts" class="nav-button {% if active_page == 'alerts' %}active{% endif %}" href="/">Alerts</a>
      <a id="nav-admin" class="nav-button {% if active_page == 'admin' %}active{% endif %}" href="/admin">Admin Panel</a>
    </nav>
  </header>
  <main class="page-container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
