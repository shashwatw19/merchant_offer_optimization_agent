agent:
  type: http
  endpoint: "http://127.0.0.1:8080/api/evalhub/investigate"
  timeout_seconds: 120.0
  retries: 0
  auth_env: null
  auth_header: "Authorization"
  auth_prefix: "Bearer "

metrics:
  - root_cause_accuracy
  - recommendation_quality
  - findings_accuracy
  - tool_accuracy
  - hallucination
  # Optional DeepEval GEval metrics (enable when using an LLM judge):
  # - geval
  # - geval_root_cause
  # - geval_findings
  # - geval_recommendations

reports:
  html: true
  pdf: true

pass_threshold: 70.0

metric_thresholds:
  tool_accuracy: 80.0

judge:
  enabled: null        # null = auto-detect API keys; false = force offline heuristics
  provider: "auto"     # "auto" | "openai" | "gemini"
  model: null          # e.g. "gemini-2.0-flash" (with provider: "gemini") or "gpt-4o-mini"
